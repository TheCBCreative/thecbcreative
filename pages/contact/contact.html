{{{nav}}}

<main id="main-content">
  <section class="contact">

    <!-- ============ INFO PANEL ============ -->
    <!-- Static — the whole .contact section is pinned to the viewport
         height (see contact.css), so this panel never needs to move or
         scroll at all. Only the form panel beside it scrolls internally. -->
    <div class="contact__info">
      <div class="photo-bg" aria-hidden="true">
        <div class="photo-bg__photo" style="background-image: url('{{info.backgroundImage}}');"></div>
      </div>
      <div class="contact__info-content" data-reveal>
        <p class="eyebrow">
          <span class="eyebrow__line"></span>
          {{info.eyebrow}}
        </p>
        <h1>{{{info.renderedHeadline}}}</h1>
        <p class="contact__info-body">{{info.body}}</p>

        <hr class="divider">

        <ul class="contact__details">
          {{#each info.details}}<li>— {{this}}</li>
          {{/each}}
        </ul>
      </div>
    </div>

    <!-- ============ FORM PANEL ============ -->
    <div class="contact__form-panel" data-reveal>
      <!-- Posts to the Vercel Function in api/contact.mjs, which re-runs the
           bot checks server-side and emails the inquiry on via Resend.
           action/method are set for real (not just handled in JS) so the
           form still degrades to a normal submit if the fetch handler
           never attaches. -->
      <form class="form" id="contactForm" name="contact" method="POST"
            action="/api/contact" enctype="multipart/form-data"
            data-status="{{form.statusJson}}"
            data-submitting-label="{{form.submittingLabel}}"
            data-success-redirect="{{form.successRedirect}}">
        <!-- Honeypot — invisible to real users (see .field--hp in
             contact.css), but bots that auto-fill every field on a form
             will trip it. Server-side handling must also reject any
             submission where this arrives non-empty. -->
        <div class="field field--hp" aria-hidden="true">
          <label for="hp-website">Website</label>
          <input type="text" id="hp-website" name="website" tabindex="-1" autocomplete="off">
        </div>
        {{#each form.fields}}<div class="field" data-reveal>
          <label for="{{id}}">{{label}}</label>
          {{{renderedControl}}}
        </div>
        {{/each}}
        <div class="field" data-reveal>
          <label for="{{form.upload.id}}">{{form.upload.label}} <span class="field__optional">{{form.upload.labelSuffix}}</span></label>
          <div class="upload-zone" id="dropzone">
            <input type="file" accept="{{form.upload.accept}}"{{#if form.upload.multiple}} multiple{{/if}} id="{{form.upload.id}}" name="images">
            <p class="upload-zone__label">{{form.upload.dropLabel}}</p>
            <p class="upload-zone__sub">{{form.upload.subLabel}}</p>
            <p class="upload-zone__files" id="fileList"></p>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--full" id="submitBtn" data-reveal>{{form.submitLabel}}</button>

        <!-- Errors only — a successful submit navigates to the thank-you
             page instead. role="status" + aria-live means screen readers
             announce the problem without focus having to move, and it
             stays in the DOM (rather than being created on submit) so the
             live region is already registered when the text arrives. -->
        <p class="form__status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </div>

    <!-- Decorative scroll affordance: a soft shadow along the bottom of the
         form column. aria-hidden because it conveys nothing to a screen
         reader — the form's fields are all in the accessibility tree
         regardless of which part of the column is scrolled into view. -->
    <div class="contact__scroll-cue" id="scrollCue" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </div>

  </section>
</main>

{{{footer}}}
