<section class="hero" id="hero">
  <div class="hero__collage" aria-hidden="true">
    <img class="hero__image--main" src="{{images.main.src}}" alt="{{images.main.alt}}" width="{{images.main.width}}" height="{{images.main.height}}" fetchpriority="high" decoding="async">
    <img class="hero__image--accent" src="{{images.accent.src}}" alt="{{images.accent.alt}}" width="{{images.accent.width}}" height="{{images.accent.height}}" decoding="async">
  </div>
  <div class="hero__content">
    <p class="eyebrow">
      <span class="eyebrow__line"></span>
      {{eyebrow}}
    </p>
    <h1>{{{renderedHeadline}}}</h1>
    <p class="hero__subhead">{{subhead}}</p>
    <div class="hero__actions">
      {{#each buttons}}<a href="{{href}}" class="btn btn--{{style}}">{{label}}</a>
      {{/each}}
    </div>
  </div>
</section>
