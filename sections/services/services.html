<section class="services" id="services">
  <div class="services__header" data-reveal>
    <div class="services__title-col">
      <p class="eyebrow">
        <span class="eyebrow__line"></span>
        {{eyebrow}}
      </p>
      <div class="services__headline-wrap">
        <h2>{{headline}}</h2>
        <h2 class="services__title-reflection" aria-hidden="true">{{headline}}</h2>
      </div>
    </div>
    <p class="services__intro">{{intro}}</p>
  </div>

  <div class="services__cards">
    {{#each cards}}<article class="service-card service-card--{{variant}}" data-reveal>
      {{#if image}}<img src="{{image.src}}" alt="{{image.alt}}" width="{{image.width}}" height="{{image.height}}" loading="lazy" decoding="async">
      {{/if}}<div class="service-card__text" data-reveal>
        <p class="num">{{number}}</p>
        <h3>{{title}}</h3>
        <p>{{description}}</p>
      </div>
    </article>
    {{/each}}
  </div>
</section>
