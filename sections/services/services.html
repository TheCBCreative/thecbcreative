<section class="services" id="services">
  <div class="services__header">
    <div class="services__title-col">
      <p class="eyebrow">
        <span class="eyebrow__line"></span>
        {{eyebrow}}
      </p>
      <h2>{{headline}}</h2>
    </div>
    <p class="services__intro">{{intro}}</p>
  </div>

  <div class="services__cards">
    {{#each cards}}<article class="service-card service-card--{{variant}}">
      {{#if image}}<img src="{{image.src}}" alt="{{image.alt}}">
      {{/if}}<div class="service-card__text">
        <p class="num">{{number}}</p>
        <h3>{{title}}</h3>
        <p>{{description}}</p>
      </div>
    </article>
    {{/each}}
  </div>
</section>
